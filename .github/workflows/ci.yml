name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require PHP 8.3 or later
        run: |
          php --version
          composer --version
          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'

      # Strict validation, except for the one warning the exact pin of the
      # shipped package causes on purpose (ADR 0008 decision 12, ADR 0016
      # decision 2). Errors, and any other warning, still fail the step.
      - name: Validate the Composer manifest
        run: |
          set +e
          out="$(composer validate --strict --no-ansi 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -ne 1 ]; then exit "$status"; fi
          allowed='- require.openspout/openspout : exact version constraints (5.2.2) should be avoided if the package follows semantic versioning'
          other="$(printf '%s\n' "$out" | grep -e '^- ' | grep -vxF -e "$allowed" || true)"
          if [ -n "$other" ] || ! printf '%s\n' "$out" | grep -qxF -e "$allowed"; then
            echo 'composer validate reported warnings other than the expected exact-pin warning.'
            exit 1
          fi

      # One of the two steps that use the network (the other prepares the
      # release vendor/ below). Lint and tests run offline.
      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: composer lint

      # The suite now runs longer than Composer's default 300 s process
      # timeout on the hosted runner; the job timeout above still bounds it.
      - name: Tests
        env:
          COMPOSER_PROCESS_TIMEOUT: "0"
        run: composer test

      # The second step that uses the network: a production vendor/ for the
      # release build (M7 release spec sections 3.3 and 3.8), installed in a
      # folder that holds only a copy of composer.json. build/ is git-ignored.
      - name: Prepare a production vendor folder
        run: |
          mkdir -p build/release-prep
          cp composer.json build/release-prep/composer.json
          composer install --working-dir=build/release-prep --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          mv build/release-prep/vendor build/release-vendor

      # Two test builds, the second in another time zone, must give the same
      # archive (ADR 0021 decision 3).
      - name: Build the release archive twice and compare
        run: |
          php tools/release/build.php --test-build --vendor=build/release-vendor --out=build/out-1
          TZ=America/New_York php tools/release/build.php --test-build --vendor=build/release-vendor --out=build/out-2
          cmp build/out-1/*.zip.sha256 build/out-2/*.zip.sha256
