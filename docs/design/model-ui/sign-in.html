<!-- Static design mock-up exported from the model UI canvas. Reference only; not application code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiffinDB model UI: Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@400;700&family=Source+Serif+4:wght@400;700&display=swap" rel="stylesheet">
<style>
body{--brand2:#C27F00}.t-dark{--brand2:#F2B441}.t-hcl{--brand2:#000000}.t-hcd{--brand2:#FFFFFF}
.f-inter{font-family:'Inter',system-ui,sans-serif!important}
.f-lexend{font-family:'Lexend',system-ui,sans-serif!important}
.f-serif4{font-family:'Source Serif 4',Georgia,serif!important}
.f-sans{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif!important}
.f-serif{font-family:Georgia,'Times New Roman',serif!important}
.f-atk{font-family:'Atkinson Hyperlegible',system-ui,sans-serif!important}
main>div:first-child{font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.s-90{zoom:.9}.s-115{zoom:1.15}.s-130{zoom:1.3}.s-150{zoom:1.5}
.lh-1{line-height:1.75!important}.lh-2{line-height:2!important}
.a-indigo{--accent:#2A3990;--soft:#E2E6F8}
.a-plum{--accent:#6B1F5C;--soft:#F4E1EF}
.a-graphite{--accent:#22302D;--soft:#E1E7E5}
.r-square *{border-radius:0!important}
body{margin:0;--bg:#F3F5F4;--surface:#FFFFFF;--sunk:#E6EBE9;--ink:#111A18;--ink2:#3A4744;--line:#C5CECB;--ctl:#6E7C78;--accent:#084F4A;--on-accent:#FFFFFF;--soft:#DCEEEB;--warn:#7A4300;--warn-soft:#FBEBD3}
.t-dark{--bg:#0F1716;--surface:#182322;--sunk:#0A100F;--ink:#EEF3F1;--ink2:#BAC7C3;--line:#35443F;--ctl:#8C9C97;--accent:#7AD9CD;--on-accent:#06211E;--soft:#17393A;--warn:#F2B866;--warn-soft:#3A2A10}
.t-hcl{--bg:#FFFFFF;--surface:#FFFFFF;--sunk:#FFFFFF;--ink:#000000;--ink2:#000000;--line:#000000;--ctl:#000000;--accent:#003B37;--on-accent:#FFFFFF;--soft:#D5F0EC;--warn:#4A2800;--warn-soft:#FFE9C2}
.t-hcd{--bg:#000000;--surface:#000000;--sunk:#000000;--ink:#FFFFFF;--ink2:#FFFFFF;--line:#FFFFFF;--ctl:#FFFFFF;--accent:#8FF5E8;--on-accent:#000000;--soft:#00302C;--warn:#FFD27A;--warn-soft:#3A2A00}
.t-dark.a-indigo{--accent:#AEB9FF;--soft:#252C57}
.t-dark.a-plum{--accent:#F0A8DD;--soft:#4A1F41}
.t-dark.a-graphite{--accent:#D5DDDA;--soft:#2A3532}
a{color:var(--accent)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=checkbox]{accent-color:var(--accent)}
</style>
<script src="preview.js" defer></script>
</head>
<body>
<div class="tdb-root" style="min-height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 18px; line-height: 1.5">

<main style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 16px">
<div style="display: flex; align-items: center; gap: 14px; color: var(--accent); font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 1">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64" fill="none"><path d="M10 57V17a22 12 0 0 1 44 0v40" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"></path><rect x="23" y="2.5" width="18" height="6" rx="3" fill="currentColor"></rect><rect x="15.5" y="17" width="33" height="4" rx="2" fill="currentColor"></rect><rect x="17" y="22.5" width="30" height="9.5" rx="3" fill="currentColor"></rect><rect x="17" y="34" width="30" height="10.5" rx="3" fill="var(--brand2)"></rect><rect x="17" y="46.5" width="30" height="10.5" rx="3" fill="currentColor"></rect></svg>
<span><span style="color: var(--ink)">Tiffin</span>DB</span></div>

<form style="width: 100%; max-width: 440px; box-sizing: border-box; margin: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
<h1 style="margin: 0; font-size: 30px; line-height: 1.2">Sign in</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="user" style="font-weight: 700">Username</label>
<input id="user" type="text" autocomplete="username" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid var(--ctl); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pass" style="font-weight: 700">Password</label>
<input id="pass" type="password" autocomplete="current-password" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid var(--ctl); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" style="width: 24px; height: 24px; margin: 0"> Show password</label>
</div>
<a href="projects.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 2px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 700">Sign in</a>
<p style="margin: 0; color: var(--ink2)">Forgotten your password? Ask the person who looks after this TiffinDB to reset it.</p>
</form>
</main>

<footer style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; padding: 16px 24px; border-top: 1px solid var(--line); font-size: 16px; color: var(--ink2)">
<span>TiffinDB, free software under AGPL-3.0-or-later</span>
<a href="https://github.com/osh-labs/tiffindb">Source code</a>
</footer>
</div>
</body>
</html>
